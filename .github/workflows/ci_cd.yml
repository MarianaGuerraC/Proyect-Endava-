name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ci-cd
  pull_request:
    branches:
      - main
      - ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.ci -t mg-fg-movie-shop-ci .

      # 3️ Levantar API y correr tests
      - name: Run API container + Pytest
        run: |
          docker run -d -p 8000:8000 --name api_test mg-fg-movie-shop-ci

          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is up!"
              break
            fi
            echo "Waiting for API..."
            sleep 2
          done

          docker exec api_test uv run pytest testing/src --junitxml=/app/reports/test-results.xml

      # 4️ Copiar resultados del contenedor al runner
      - name: Copy Test Results
        run: docker cp api_test:/app/reports/test-results.xml ./test-results.xml

      # 5️ Subir resultados de tests como artifact
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results.xml

      # 6️ Limpiar contenedor
      - name: Stop and Remove Container
        run: docker rm -f api_test
