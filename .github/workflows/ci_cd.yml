name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - ci-cd
  pull_request:
    branches:
      - main
      - ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.ci -t mg-fg-movie-shop-ci .

      # 3️ Run API container + Pytest
      - name: Run API + Tests
        run: |
          docker run -d --rm -p 8000:8000 --name api_test mg-fg-movie-shop-ci
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is up!"
              break
            fi
            echo "Waiting for API..."
            sleep 2
          done
          docker exec api_test pytest testing/src --junitxml=reports/test-results.xml
          RESULT=$?
          docker stop api_test
          exit $RESULT

      # 4 Run tests in Docker
      - name: Run Pytest in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            mg-fg-movie-shop-ci pytest testing/src --junitxml=reports/test-results.xml

      # 5 Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: testing/reports/test-results.xml
